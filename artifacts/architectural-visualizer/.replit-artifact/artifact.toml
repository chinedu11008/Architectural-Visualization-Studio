kind = "web"
previewPath = "/"
title = "Architectural Visualization Studio"
description = "An AI-assisted architectural visualization workspace for uploading BIM models, adding environment references, and exploring generated 3D scene concepts in the browser."
version = "1.0.0"
id = "artifacts/architectural-visualizer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23991

[services.development]
run = "pnpm --filter @workspace/architectural-visualizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/architectural-visualizer", "run", "build" ]
serve = "static"
publicDir = "artifacts/architectural-visualizer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23991"
BASE_PATH = "/"
